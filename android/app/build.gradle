plugins {
    id 'com.android.application'
}

android {
    namespace 'com.skylinecourier.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.skylinecourier.game'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '4.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs without extra setup.
            // Replace with your own signingConfig before publishing to the Play Store.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The game itself (HTML/JS built by `npm run build`) lives in ../../www.
    sourceSets {
        main {
            assets.srcDirs = ['../../www']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
